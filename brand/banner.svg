<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="repo-tooling — One CLI to scaffold, audit and fix your repo's whole toolchain — linting, tests, commits, releases &amp; CI.">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1117"/>
			<stop offset="1" stop-color="#090c13"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.16" cy="0" r="0.55">
			<stop offset="0" stop-color="#34d399" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#34d399" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.92" cy="1" r="0.5">
			<stop offset="0" stop-color="#6e7bff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#6e7bff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1280" height="320" fill="url(#bg)"/>
	<rect width="1280" height="320" fill="url(#glow)"/>
	<rect width="1280" height="320" fill="url(#glow2)"/>

	<!-- Logo mark: a 32 viewBox, so the real favicon glyph can be pasted in over it. -->
	<g transform="translate(60 88) scale(2.25)">
		<rect width="32" height="32" rx="8" fill="#34d399"/>
		<text x="16" y="23" text-anchor="middle" font-family="Avenir Next" font-weight="800" font-size="19" fill="#0A0E16">R</text>
	</g>

	<text x="156" y="150" font-family="Avenir Next" font-weight="800" font-size="62" letter-spacing="-1.5"><tspan fill="#e6edf3">repo-</tspan><tspan fill="#34d399">tooling</tspan></text>

	<text font-family="Avenir Next" font-weight="500" font-size="20" fill="#9ba6b8">
		<tspan x="62" y="198">One CLI to scaffold, audit and fix your</tspan>
		<tspan x="62" y="226">repo's whole toolchain — linting, tests,</tspan>
		<tspan x="62" y="254">commits, releases &amp; CI.</tspan>
	</text>

	<rect x="845" y="118" width="378" height="84" rx="14" fill="#11151d" stroke="#232936" stroke-width="1"/>
	<text xml:space="preserve" x="1034" y="166.66666666666666" text-anchor="middle" font-family="Menlo" font-size="20"><tspan fill="#34d399">npm i </tspan><tspan fill="#e6edf3">@rtorcato/repo-tooling</tspan></text>
</svg>
