packages:
  - 'apps/*'

allowBuilds:
  core-js: false
  core-js-pure: false
  # napi-postinstall only *checks* that the platform binary is present — the
  # binary itself arrives as an optional dep — so there's no real build to run.
  # Same call as core-js; esbuild/sharp below genuinely compile.
  unrs-resolver: false
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# Whitelist packages from pnpm's 24h minimumReleaseAge supply-chain policy.
# The default cutoff defends against typosquat-hijack attacks, but it also
# blocks every install (including CI) when a low-risk transitive dep we
# already pinned gets a fresh patch publish. Add entries here when a
# specific package has been vetted and the wait isn't worth the friction.
minimumReleaseAgeExclude:
  - '@rtorcato/*'
  - tinyglobby

# Force patched versions past parent pins (#536). Scoped to the vulnerable
# ranges so they self-retire once parents catch up. serialize-javascript and
# uuid sit in the private apps/docs webpack chain; esbuild is vite's dev-only
# pin (GHSA-g7r4-m6w7-qqqr, Windows dev server). image-size (GHSA high) has
# no published patch — 2.x ends at 2.0.2 — so it stays open until upstream ships.
overrides:
  'serialize-javascript@<7.0.5': '>=7.0.5'
  'uuid@<11.1.1': '>=11.1.1'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'

# Don't re-verify node_modules on every script run — the check costs a
# second per invocation and CI installs with --frozen-lockfile anyway.
verifyDepsBeforeRun: false
