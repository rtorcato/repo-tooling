name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, release, ci-testing]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Allow manual triggers

    # Prevent concurrent runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip CI if commit message contains [skip ci] or [ci skip]
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.skip-check.outputs.should-skip }}
    steps:
      - name: Check for skip CI
        id: skip-check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* || "$COMMIT_MSG" == *"[ci skip]"* ]]; then
            echo "✅ Found skip CI directive - skipping pipeline"
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "🚀 No skip CI directive found - running pipeline"
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

  # Install dependencies and cache them
  dependencies:
    runs-on: ubuntu-latest
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true'
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

  # Linting and code quality
  lint:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔍 Run linting
        run: pnpm lint

  # Commit message validation
  commitlint:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true' && github.event_name == 'push'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔍 Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For push events, validate the latest commit
            echo "Validating latest commit message..."
            git log -1 --pretty=format:"%s" | npx commitlint
          else
            echo "Skipping commitlint for non-push events"
          fi

  # Type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔍 Type check
        run: pnpm typecheck

  # Variable validation
  varcheck:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 🔍 Check environment variables
        run: |
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
          echo "GITHUB_ACTOR: ${{ github.actor }}"

          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "❌ GITHUB_TOKEN is not set"
            exit 1
          else
            echo "✅ GITHUB_TOKEN is available"
          fi

          # npm publish uses OIDC trusted publishing (no NPM_TOKEN secret needed).

  # Testing — run on every supported Node major
  test:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: test (node ${{ matrix.node-version }})
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        if: matrix.node-version != '22'
        run: pnpm test --run

      - name: 🧪 Run tests with coverage
        if: matrix.node-version == '22'
        run: pnpm coverage

      - name: 📊 Upload coverage
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false

  # Integration: scaffold the library preset and run its full consumer
  # lifecycle (install → format → build → verify) against a pack of THIS tree.
  # Catches scaffold defects that only surface on a real install/build — the
  # class of bug that unit tests miss (#99). Runs on every supported Node major.
  integration:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: integration (node ${{ matrix.node-version }})
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      # #313 planned to gate the four app presets on push-to-main over wall-clock
      # cost. Measured on #343: all five take 1m38s versus 44s for library alone,
      # so the gate bought ~1 minute and cost full coverage on PRs. Run them all.
      - name: 🧩 Scaffold + install + verify every preset
        run: |
          for preset in library node-api web-app react-app nextjs-app; do
            node scripts/integration/preset-lifecycle.mjs "$preset"
          done

  # Integration: the CLI as a public consumer sees it — HOME pointed at an empty
  # temp dir, so no ~/.claude, no stow symlinks and none of the maintainer's
  # dotfiles exist (#460). Catches the silent class where shipped surface assumes
  # a machine that only the maintainer has. One Node major: this exercises path
  # and HOME handling, not the runtime, which the job above already matrixes.
  integration-no-dotfiles:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      - name: 🏠 setup + doctor + fix against an empty HOME
        run: node scripts/integration/no-dotfiles.mjs

  # swift-library can't ride the job above: ubuntu-latest ships no Swift
  # toolchain, and the scaffold's own CI targets Apple platforms anyway (#312).
  # macos-latest over a swift:* container because macOS runners are free on
  # public repos, and it's the platform the generated package actually claims.
  integration-swift:
    runs-on: macos-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      # Not on the macos-latest image — the first run of this job logged
      # "swiftlint not on PATH". Without it the scaffold's lint gate, which is
      # half of what the Swift preset ships, would never be exercised.
      - name: 📦 Install SwiftLint
        run: brew install swiftlint

      - name: 🧩 Scaffold + build + test + lint swift-library
        run: node scripts/integration/preset-lifecycle.mjs swift-library

  # Build
  build:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🏗️ Build project
        run: pnpm build-cli

      - name: 🐕 Dogfood — run the built doctor against this repo
        run: pnpm dogfood
        env:
          # Lets the GitHub-settings checks read live protection; they self-skip
          # gracefully if the token lacks admin:read, so this never hard-fails.
          GH_TOKEN: ${{ github.token }}

      # Smoke-test the composite action we ship (#315) the way a consumer uses
      # it. `fail-on: none` because doctor has genuine self-repo findings (see
      # scripts/dogfood.mjs) — this proves the wiring, dogfood proves the checks.
      - name: 🎬 Smoke-test the composite action
        id: action-smoke
        uses: ./
        with:
          fail-on: none
        env:
          REPO_TOOLING_ALLOW_SELF: '1'

      - name: 🎬 Assert the action emitted a report
        run: jq -e '.results | length > 0' <<<"$REPORT" >/dev/null
        env:
          REPORT: ${{ steps.action-smoke.outputs.json }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            dist/
            package.json
            README.md
            pnpm-lock.yaml
          retention-days: 7

  # Release and publish
  release:
    runs-on: ubuntu-latest
    needs:
      [
        dependencies,
        lint,
        typecheck,
        test,
        integration,
        integration-no-dotfiles,
        integration-swift,
        build,
        varcheck,
        check-skip,
      ]
    if: |
      always() &&
      needs.check-skip.outputs.should-skip != 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.dependencies.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.integration-no-dotfiles.result == 'success' &&
      needs.integration-swift.result == 'success' &&
      needs.build.result == 'success' &&
      needs.varcheck.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch full history for semantic-release
          # RELEASE_TOKEN is an admin PAT so semantic-release can push the
          # version commit + tag to a protected main (github-actions[bot]
          # can't bypass branch protection). Falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🏗️ Build CLI
        run: pnpm run build-cli

      # OIDC trusted publishing needs npm CLI >= 11.5.1; Node 22 ships 10.x, so
      # semantic-release's own OIDC token exchange succeeds but the `npm publish`
      # it shells out to fails with ENEEDAUTH. Upgrade npm so it can use the token.
      - name: 📦 Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: 🚀 Run semantic-release
        # Publishes to npm via OIDC trusted publishing — no NPM_TOKEN. Requires
        # the `id-token: write` permission above + a trusted publisher configured
        # for the package on npmjs.com (Settings → Trusted Publisher, workflow ci.yml).
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
