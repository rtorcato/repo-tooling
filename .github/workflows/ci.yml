name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, release, ci-testing]
  pull_request:
    branches: [main]
    # `edited` re-lints a retitled PR (#777).
    types: [opened, synchronize, reopened, edited]
  # Releases live in release.yml (#753).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nothing here publishes any more (#753), so a newer push supersedes CI freely.
  cancel-in-progress: true

jobs:
  # Skip CI if commit message contains [skip ci] or [ci skip]
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.skip-check.outputs.should-skip }}
      swift: ${{ steps.swift-paths.outputs.swift }}
    steps:
      - name: 📦 Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The macOS Swift job is the slowest in the pipeline, so on a PR it runs
      # only when the diff can reach the swift-library preset: the Swift module
      # and everything it imports. Pushes always run it, so main's tip — what a
      # release publishes — is never an unexercised preset.
      - name: Check whether the Swift preset is affected
        id: swift-paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(src/languages/swift/|src/languages/registry\.ts|src/base/|src/cli/commands/setup|src/cli/generators/(agent-rules|misc|security)\.ts|src/cli/utils/(copy-preset|lockfile)\.ts|scripts/integration/|tooling/swift|\.github/workflows/ci\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Swift-relevant changes — skipping integration-swift"
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for skip CI
        id: skip-check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* || "$COMMIT_MSG" == *"[ci skip]"* ]]; then
            echo "✅ Found skip CI directive - skipping pipeline"
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "🚀 No skip CI directive found - running pipeline"
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

  # Install dependencies and cache them
  dependencies:
    runs-on: ubuntu-latest
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true'
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

  # Linting and code quality
  lint:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔍 Run linting
        run: pnpm lint

  # Commit message validation
  commitlint:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      # On a PR, lint the title plus " (#N)" — exactly the header a squash merge
      # commits — so an over-long title fails here, not on main (#777). The
      # title goes through env:, never ${{ }} in run:, since the PR author
      # controls it. On a push, lint the commit that landed.
      - name: 🔍 Validate commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | npx commitlint
          else
            git log -1 --pretty=format:"%s" | npx commitlint
          fi

  # Type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🔍 Type check
        run: pnpm typecheck

  # Variable validation
  varcheck:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 🔍 Check environment variables
        run: |
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
          echo "GITHUB_ACTOR: ${{ github.actor }}"

          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "❌ GITHUB_TOKEN is not set"
            exit 1
          else
            echo "✅ GITHUB_TOKEN is available"
          fi

          # npm publish uses OIDC trusted publishing (no NPM_TOKEN secret needed).

  # Testing — run on every supported Node major
  test:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: test (node ${{ matrix.node-version }})
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        if: matrix.node-version != '22'
        run: pnpm test --run

      - name: 🧪 Run tests with coverage
        if: matrix.node-version == '22'
        run: pnpm coverage

      - name: 📊 Upload coverage
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false

  # Integration: scaffold the library preset and run its full consumer
  # lifecycle (install → format → build → verify) against a pack of THIS tree.
  # Catches scaffold defects that only surface on a real install/build — the
  # class of bug that unit tests miss (#99). Runs on every supported Node major.
  integration:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: integration (node ${{ matrix.node-version }})
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      # #313 planned to gate the four app presets on push-to-main over wall-clock
      # cost. Measured on #343: all five take 1m38s versus 44s for library alone,
      # so the gate bought ~1 minute and cost full coverage on PRs. Run them all.
      - name: 🧩 Scaffold + install + verify every preset
        run: |
          for preset in library node-api web-app react-app nextjs-app; do
            node scripts/integration/preset-lifecycle.mjs "$preset"
          done

  # Integration: the CLI as a public consumer sees it — HOME pointed at an empty
  # temp dir, so no ~/.claude, no stow symlinks and none of the maintainer's
  # dotfiles exist (#460). Catches the silent class where shipped surface assumes
  # a machine that only the maintainer has. One Node major: this exercises path
  # and HOME handling, not the runtime, which the job above already matrixes.
  integration-no-dotfiles:
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      - name: 🏠 setup + doctor + fix against an empty HOME
        run: node scripts/integration/no-dotfiles.mjs

  # swift-library can't ride the job above: ubuntu-latest ships no Swift
  # toolchain, and the scaffold's own CI targets Apple platforms anyway (#312).
  # macos-latest over a swift:* container because macOS runners are free on
  # public repos, and it's the platform the generated package actually claims.
  integration-swift:
    runs-on: macos-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.check-skip.outputs.swift == 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build CLI
        run: pnpm build-cli

      # Not on the macos-latest image — the first run of this job logged
      # "swiftlint not on PATH". Without it the scaffold's lint gate, which is
      # half of what the Swift preset ships, would never be exercised.
      - name: 📦 Install SwiftLint
        run: brew install swiftlint

      - name: 🧩 Scaffold + build + test + lint swift-library
        run: node scripts/integration/preset-lifecycle.mjs swift-library

  # Build
  build:
    runs-on: ubuntu-latest
    needs: [dependencies, check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🏗️ Build project
        run: pnpm build-cli

      - name: 🐕 Dogfood — run the built doctor against this repo
        run: pnpm dogfood
        env:
          # Lets the GitHub-settings checks read live protection; they self-skip
          # gracefully if the token lacks admin:read, so this never hard-fails.
          GH_TOKEN: ${{ github.token }}

      # Smoke-test the composite action we ship (#315) the way a consumer uses
      # it. `fail-on: none` because doctor has genuine self-repo findings (see
      # scripts/dogfood.mjs) — this proves the wiring, dogfood proves the checks.
      - name: 🎬 Smoke-test the composite action
        id: action-smoke
        uses: ./
        with:
          fail-on: none
        env:
          REPO_TOOLING_ALLOW_SELF: '1'

      - name: 🎬 Assert the action emitted a report
        run: jq -e '.results | length > 0' <<<"$REPORT" >/dev/null
        env:
          REPORT: ${{ steps.action-smoke.outputs.json }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            dist/
            package.json
            README.md
            pnpm-lock.yaml
          retention-days: 7
