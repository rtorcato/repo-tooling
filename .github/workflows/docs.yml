name: Deploy Docs

on:
  push:
    branches: [main]
    # src/**, package.json and README.md so a shipped change or a release's
    # version bump redeploys — not just edits under apps/docs.
    paths:
      - 'apps/docs/**'
      - 'src/**'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-deploy-cloudflare.yml'
  # release.yml dispatches this after a publish, so the changelog page (built
  # from the GitHub releases) picks up the new one. It does not subscribe to
  # `release: published`: a release made with GITHUB_TOKEN starts no run, and a
  # run triggered by that event has the tag as its ref, which the Cloudflare
  # deploy would not take from `main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Primary site: https://docs.torcato.dev/repo-tooling/ (config.docs in .repo-tooling.json).
  cloudflare:
    permissions:
      contents: read
    uses: ./.github/workflows/docs-deploy-cloudflare.yml
    with:
      build-filter: '@rtorcato/docs'
      worker-name: repo-tooling-docs
      base-path: /repo-tooling/
      route: docs.torcato.dev/repo-tooling/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
