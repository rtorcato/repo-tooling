name: Reusable Deploy Docs

# Reusable Docusaurus → GitHub Pages deploy. Call it from any @rtorcato/* repo:
#
#   jobs:
#     docs:
#       permissions: { contents: read, pages: write, id-token: write }
#       uses: rtorcato/repo-tooling/.github/workflows/docs-deploy.yml@v6.0.0   # pin a release tag, not @main
#       with:
#         build-filter: '@rtorcato/<pkg>-docs'
#
# Caller decides WHEN to deploy (push paths, release, dispatch); this owns HOW.
on:
  workflow_call:
    inputs:
      build-filter:
        description: 'pnpm --filter target for the docs app, e.g. @rtorcato/cf-common-docs'
        required: true
        type: string
      build-output:
        description: 'Directory the docs build emits'
        required: false
        default: 'apps/docs/build'
        type: string
      node-version:
        description: 'Node version'
        required: false
        default: '22'
        type: string

# Least privilege per job: only deploy can write Pages or mint an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's Pages config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read-only (job is contents/pages: read). Docs builds that call the GitHub API, e.g. to
      # sync release notes, otherwise share the runner IP's 60/hr unauthenticated limit.
      - name: Build docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter ${{ inputs.build-filter }} build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ inputs.build-output }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
