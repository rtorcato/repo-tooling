name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: cache-key
        run: echo "key=deps-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

  test:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - run: pnpm test

  release:
    needs: [dependencies, test]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.dependencies.outputs.cache-key }}

      - name: 🏗️ Build project
        run: pnpm build

      - name: 🚀 Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: 🔎 Determine whether the release shipped
        id: shipped
        run: echo "shipped=$(git tag --points-at HEAD | head -1)" >> "$GITHUB_OUTPUT"

      # Docs follow the published version.
      - name: 📘 Redeploy the docs after a publish
        if: steps.shipped.outputs.shipped != ''
        run: gh workflow run docs.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🔔 Report release failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: core.warning('release failed')
