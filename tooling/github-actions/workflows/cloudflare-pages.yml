# Deploy a static build to Cloudflare Pages on push to main: a preview deploy
# right away, then the production deploy once someone approves the
# `production` environment (rtorcato/repo-tooling#848). No long-lived prod
# branch: main is the source, the environment is the gate.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Set your Pages project name below (replace YOUR_PROJECT) and the build
# output dir if it isn't `dist`. Pages treats a deploy as production only when
# --branch matches the project's production branch, so keep that `main`.
#
# GitHub creates a missing environment on first use with NO protection, so the
# production job would deploy unreviewed. Create it first, with you as the
# required reviewer (the same gate as the npm `release` environment), limited to
# `main` so a dispatch from another branch can never reach it:
#   echo "{\"reviewers\":[{\"type\":\"User\",\"id\":$(gh api user --jq .id)}],\"deployment_branch_policy\":{\"protected_branches\":false,\"custom_branch_policies\":true}}" \
#     | gh api -X PUT "repos/{owner}/{repo}/environments/production" --input -
#   gh api -X POST "repos/{owner}/{repo}/environments/production/deployment-branch-policies" \
#     -f name=main -f type=branch
name: ☁️ Cloudflare Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Any branch other than the production one is a preview deploy.
          command: pages deploy dist --project-name=YOUR_PROJECT --branch=preview

  production:
    needs: preview
    # A workflow_dispatch from another branch gets a preview, never production.
    if: github.ref == 'refs/heads/main'
    # Waits for a required reviewer on the `production` environment (see top).
    environment: production
    # A newer push waiting for approval supersedes an older waiting one; a
    # deploy already running is never cancelled.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages production
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=YOUR_PROJECT --branch=main
